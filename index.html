<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Welcome to Our WebApp</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(120deg, #4f8cff 0%, #38e6c5 100%);
            color: #222;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            padding: 2rem 0 1rem 0;
            text-align: center;
        }
        h1 {
            margin: 0;
            font-size: 2.5rem;
            letter-spacing: 2px;
        }
        p {
            font-size: 1.2rem;
            margin: 1rem 0 2rem 0;
            color: #333;
        }
        .cta-btn {
            display: inline-block;
            padding: 0.75rem 2rem;
            background: #222;
            color: #fff;
            border: none;
            border-radius: 30px;
            font-size: 1.1rem;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
        }
        .cta-btn:hover {
            background: #4f8cff;
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        footer {
            text-align: center;
            padding: 1rem 0;
            font-size: 0.95rem;
            color: #555;
            background: rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to Our WebApp</h1>
        <p>Your journey to productivity starts here.</p>
    </header>
    <main>
        <a href="#get-started" class="cta-btn">Get Started</a>
    </main>
    <footer>
        &copy; 2024 WebApp. All rights reserved.
    </footer>
</body>
</html>
